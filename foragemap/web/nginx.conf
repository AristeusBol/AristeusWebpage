server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri /index.html;
  }
  # Si el front y la API van en el mismo host, descomentar y apuntar al backend
  # (alternativa a buildear con VITE_API_URL=https://tu-api):
  # location /api/ { proxy_pass http://api:8000; }
  # location /uploads/ { proxy_pass http://api:8000; }
}
