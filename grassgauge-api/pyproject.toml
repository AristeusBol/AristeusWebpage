[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grassgauge"
version = "1.0.0"
description = "Motor analítico espacial y forrajero para ganadería de precisión"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "pandas",
    "geopandas",
    "geoalchemy2",
    "shapely",
    "bcrypt",
    "python-dotenv",
    "python-jose[cryptography]",
    "python-multipart",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["api*", "core*", "repositorios*", "motor_analitico*"]