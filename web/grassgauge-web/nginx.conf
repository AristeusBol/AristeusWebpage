server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / {
    try_files $uri /index.html;
  }
  # Subpath /app para despliegue mismo-origen con el panel Aristeus
  # (reverse proxy: /app -> este contenedor). Requiere build con base '/app/'.
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }
  # Si el front y la API van en el mismo host, descomentar y apuntar al backend
  # (alternativa a buildear con VITE_API_URL=https://tu-api):
  # location /api/ { proxy_pass http://api:8000; }
  # location /uploads/ { proxy_pass http://api:8000; }
}
