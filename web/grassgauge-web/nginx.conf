server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Este contenedor solo sirve la app GrassGauge bajo /app
  # (el panel Aristeus proxea /app -> este contenedor sin reescribir prefijo).
  location = /app { return 301 /app/; }
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  # El worker ESM de maplibre-gl (/app/maplibre-gl-worker.mjs + shared)
  # exige MIME JavaScript: mime.types de la imagen no mapea .mjs
  # (caía a application/octet-stream y el Worker fallaba en silencio).
  # OJO: `types` suma a los incluidos, no los reemplaza.
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }

  # API mismo-origen: el front buildea con VITE_API_URL="" y llama a /api
  # y /uploads relativos; nginx los reenvía al servicio api (sin CORS).
  location /api/ { proxy_pass http://api:8000; }
  location /uploads/ { proxy_pass http://api:8000; }
  location = /health { proxy_pass http://api:8000; }
}
